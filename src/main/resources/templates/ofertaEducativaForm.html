<!DOCTYPE html>
<html lang="en">
<head th:replace="fragments/fragment :: head('Formulario')"></head>
<body>
    <nav th:replace="fragments/fragment :: navbar"></nav>
    <nav th:replace="fragments/fragment :: breadcrumb(${ofertaEducativa.id != 0 ? 'Editar' : 'Agregar'}, 'Ofertas Educativas', '/admin/ofertas-educativas')"></nav>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold" th:text="${ofertaEducativa.id != 0 ? 'Editar Oferta' : 'Agregar Oferta'}"></h3>
                        <form th:action="@{/admin/oferta-educativa/save}" method="post" th:object="${ofertaEducativa}">
                            <div class="mb-3" th:if="${ofertaEducativa.id != 0}">
                                <label for="id" class="form-label fw-bold">ID de la oferta:</label>
                                <input type="text" class="form-control" id="id" th:field="*{id}" placeholder="Ingrese el ID de la oferta" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="nombreOferta" class="form-label fw-bold">Nombre de la oferta:</label>
                                <input type="text" class="form-control" id="nombreOferta" th:field="*{nombreOferta}" placeholder="Ingrese el nombre de la oferta">
                                <div class="text-danger small" th:if="${#fields.hasErrors('nombreOferta')}" th:errors="*{nombreOferta}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="modalidad" class="form-label fw-bold">Modalidad:</label>
                                <input type="text" class="form-control" id="modalidad" th:field="*{modalidad}" placeholder="Ingrese la modalidad">
                                <div class="text-danger small" th:if="${#fields.hasErrors('modalidad')}" th:errors="*{modalidad}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="division" class="form-label fw-bold">División:</label>
                                <select class="form-select" id="division" th:field="*{division}">
                                    <option value="">Seleccione una división</option>
                                    <option th:each="division : ${divisiones}" th:value="${division.id}" th:text="${division.nombre}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('division')}" th:errors="*{division}"></div>
                            </div>
                            <div class="mb-4">
                                <label for="imagen" class="form-label fw-bold">Imagen:</label>
                                <input type="text" class="form-control" id="imagen" th:field="*{imagen}" placeholder="Ingrese la URL de la imagen">
                                <div class="text-danger small" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn text-white fw-bold" style="background-color: #6AA276; border-color: #6AA276;">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
