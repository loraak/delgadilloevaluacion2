<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            crossorigin="anonymous">
    <link rel="icon" th:href="@{/images/loro.jpg}" type="image/jpeg">
</head>

<body>
        <nav class="navbar navbar-expand-lg py-4" style="background-color: #6AA276; padding: 10px;" th:fragment="navbar">
            <div class="container-fluid">
                <a class="navbar-brand text-white fw-bold" th:href="@{/}">MR. FRESH COMPANY</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/ofertas-educativas}">Ofertas Educativas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/divisiones}">Divisiones</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/perfiles-ingreso}">Perfiles de Ingreso</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/perfiles-profesionales}">Perfiles Profesionales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/plan-estudios}">Plan de Estudios</a>
                        </li>
                        <li class="nav-item">
                            <a sec:authorize="!hasRole('ADMIN')" class="nav-link text-white" th:href="@{/seccion-institucional}">Sección Institucional</a>
                            <a sec:authorize="hasRole('ADMIN')" class="nav-link text-white" th:href="@{/admin/seccion-institucional}">Sección Institucional</a>
                        </li>
                    </ul>
                    <div class="ms-auto d-flex align-items-center" sec:authorize="isAuthenticated()">
                        <div class="text-white me-3">
                            <span>Usuario: <strong sec:authentication="name"></strong></span>
                        </div>
                        <form th:action="@{/logout}" method="post">
                            <button class="btn btn-outline-light" type="submit">Cerrar Sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>

        <nav style="padding: 10px;--bs-breadcrumb-divider: '>';" aria-label="breadcrumb" th:fragment="breadcrumb(item, parentName, parentLink)">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li class="breadcrumb-item" th:if="${parentName != null}"><a th:href="@{${parentLink}}" th:text="${parentName}"></a></li>
                <li class="breadcrumb-item active" aria-current="page" th:if="${item != null}" th:text="${item}"></li>
            </ol>
        </nav>

        <div th:fragment = "scripts">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        </div>

</body>
</html>
