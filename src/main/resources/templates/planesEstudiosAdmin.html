<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/fragment :: head('Plan de Estudios')"></head>

    <body> 
        <nav th:replace="fragments/fragment :: navbar"></nav>
        <nav th:replace="fragments/fragment :: breadcrumb('Panel de Plan de Estudios', null, null)"></nav>
        <div class="container">
            <main>
                <h2 class="text-center my-4">Panel - Plan de Estudios</h2>
                <div class="row row-cols-1 row-cols-md-3 g-4 mb-5" id="planes-container">      
                    <div class="col" th:each="plan : ${planes}" th:id="|plan-card-${plan.id}|">
                        <div class="card h-100 shadow-sm border-1">
                            <img th:src="@{${plan.imagen}}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <div class="mb-2">
                                    <h6 class="fw-semibold text-secondary">Oferta Educativa:</h6>
                                    <span class="text-dark" th:text="${plan.ofertaEducativa != null ? plan.ofertaEducativa.nombreOferta : 'Sin oferta'}">Oferta Educativa</span>
                                </div>
                                <div class="mt-auto pt-3">
                                    <button type="button" class="btn text-white w-100 fw-semibold"
                                        style="background-color: #6AA276; border-color: #6AA276;" th:onclick="|abrirModalPlan(${plan.id})|">Editar</button>
                                </div>
                                <div class="mt-2">
                                    <button type="button" class="btn text-white w-100 fw-semibold" style="background-color: #C73E3E; border-color:#C73E3E;" th:onclick="|eliminarPlan(${plan.id})|"> Eliminar </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <button type="button" onclick="abrirModalPlan()"
            class="btn text-white rounded-circle d-flex align-items-center justify-content-center shadow-lg"
            style="position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background-color: #6AA276; border-color: #6AA276; font-size: 30px; z-index: 500;" title="Agregar Plan">
            +
        </button>

            <!-- Modal -->
        <div class="modal fade" id="planModal" tabindex="-1" aria-labelledby="planModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="planModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="planForm" class="needs-validation" novalidate onsubmit="guardarPlan(event)">
                            <input type="hidden" id="planId" name="id">
                            <div class="mb-3">
                                <label for="imagen" class="form-label fw-bold">URL de la imagen:</label>
                                <input type="text" class="form-control" id="imagen" name="imagen"
                                    placeholder="Ingrese la URL de la imagen" oninput="mostrarPreview(this.value)">
                                <img id="imagenPreview" src="" alt="Preview"
                                    class="mt-2 d-none"
                                    style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
                            </div>
                            <div class="mb-3">
                                <label for="ofertaId" class="form-label fw-bold">Oferta Educativa:</label>
                                <select class="form-select" id="ofertaId" name="ofertaId">
                                    <option th:each="oferta : ${ofertas}"
                                        th:value="${oferta.id}"
                                        th:text="${oferta.nombreOferta}"></option>
                                </select>
                            </div>
                            <div id="planAlertaError" class="alert alert-danger d-none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" form="planForm" class="btn text-white fw-semibold"
                            style="background-color: #6AA276; border-color: #6AA276;">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/planesEstudios.js}"></script>
        <div th:replace="fragments/fragment :: scripts"></div>
    </body>
</html>
