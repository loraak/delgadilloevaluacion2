<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/fragment :: head('Perfiles de Ingreso')"></head>

    <body> 
        <nav th:replace="fragments/fragment :: navbar"></nav>
        <nav th:replace="fragments/fragment :: breadcrumb('Panel de Perfiles de Ingreso', null, null)"></nav>
        <div class="container">
            <main>
                <h2 class="text-center my-4">Panel - Perfiles de Ingreso</h2>
                <div class="row row-cols-1 row-cols-md-3 g-4 mb-5" id="perfiles-container">      
                    <div class="col" th:each="perfil : ${perfiles}" th:id="|perfil-card-${perfil.id}|">
                        <div class="card h-100 shadow-sm border-1">
                            <div class="card-body d-flex flex-column">
                                <h6 class="fw-semibold text-secondary">Título:</h6>
                                <h5 class="card-title" th:text="${perfil.titulo}">Título del perfil</h5>
                                <div class="mb-2">
                                    <h6 class="fw-semibold text-secondary">Descripción:</h6>
                                    <span class="text-dark" th:text="${perfil.descripcion}">Descripción</span>
                                </div>
                                <div class="mb-3">
                                    <h6 class="fw-semibold text-secondary">Capacidades Transversales:</h6>
                                    <ul class="list-unstyled mb-0" th:if="${!#lists.isEmpty(perfil.capacidadesTransversales)}">
                                        <li th:each="capacidad : ${perfil.capacidadesTransversales}">
                                            <span th:text="${capacidad.descripcion}"></span>
                                        </li>
                                    </ul>
                                    <small class="text-muted" th:if="${#lists.isEmpty(perfil.capacidadesTransversales)}">
                                        No hay capacidades registradas.
                                    </small>
                                </div>
                                <div class="mb-3">
                                    <h6 class="fw-semibold text-secondary">Capacidades Específicas:</h6>
                                    <ul class="list-unstyled mb-0" th:if="${!#lists.isEmpty(perfil.capacidadesEspecificas)}">
                                        <li th:each="capacidadEsp : ${perfil.capacidadesEspecificas}">
                                            <span th:text="${capacidadEsp.descripcion}"></span>
                                        </li>
                                    </ul>
                                    <small class="text-muted" th:if="${#lists.isEmpty(perfil.capacidadesEspecificas)}">
                                        No hay capacidades registradas.
                                    </small>
                                </div>
                                <div class="mb-2">
                                    <h6 class="fw-semibold text-secondary">Oferta Educativa:</h6>
                                    <span class="text-dark" th:text="${perfil.ofertaEducativa != null ? perfil.ofertaEducativa.nombreOferta : 'Sin oferta'}">Oferta Educativa</span>
                                </div>
                                <div class="mt-auto pt-3">
                                    <button type="button" class="btn text-white w-100 fw-semibold"
                                        style="background-color: #6AA276; border-color: #6AA276;" th:onclick="|abrirModalPerfil(${perfil.id})|">Editar</button>
                                </div>
                                <div class="mt-2">
                                    <button type="button" class="btn text-white w-100 fw-semibold" style="background-color: #C73E3E; border-color:#C73E3E;" th:onclick="|eliminarPerfil(${perfil.id})|"> Eliminar </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <button type="button" onclick="abrirModalPerfil()"
            class="btn text-white rounded-circle d-flex align-items-center justify-content-center shadow-lg"
            style="position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background-color: #6AA276; border-color: #6AA276; font-size: 30px; z-index: 500;" title="Agregar Oferta">
            +
        </button>

        <!-- Modal -->
        <div class="modal fade" id="perfilModal" tabindex="-1" aria-labelledby="perfilModalLabel" aria-hidden="true">
            <div class="modal-dialog">|
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="perfilModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="perfilForm" class="needs-validation" novalidate onsubmit="guardarPerfil(event)">
                            <input type="hidden" id="perfilId" name="id">
                            <div class="mb-3">
                                <label for="perfilTitulo" class="form-label fw-bold">Titulo del perfil:</label>
                                <input type="text" class="form-control" id="perfilTitulo" name="perfilOferta"
                                    placeholder="Ingrese el título del perfil" required>
                                <div class="invalid-feedback">Por favor ingrese el título.</div>
                            </div>
                            <div class="mb-3">
                                <label for="modalidad" class="form-label fw-bold">Descripción:</label>
                                <input type="text" class="form-control" id="perfilDescripcion" name="perfilDescripcion"
                                    placeholder="Ingrese la modalidad" required>
                                <div class="invalid-feedback">Por favor ingrese la descripción.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Capacidades Transversales:</label>
                                <div id="capacidadesContainer"></div>
                                
                                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="agregarInputCapacidad()">
                                    + Agregar Capacidad
                                </button>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Capacidades Específicas:</label>
                                <div id="capacidadesEspContainer"></div>
                                
                                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="agregarInputCapacidadEsp()">
                                    + Agregar Capacidad Específica
                                </button>
                            </div>
                            <div class="mb-3">
                                <label for="ofertaId" class="form-label fw-bold">Oferta Educativa:</label>
                                <select class="form-select" id="ofertaId" name="ofertaId">
                                    <option th:each="oferta : ${ofertas}"
                                        th:value="${oferta.id}"
                                        th:text="${oferta.nombreOferta}"></option>
                                </select>
                            </div>
                            <div id="perfilAlertaError" class="alert alert-danger d-none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" form="perfilForm" class="btn text-white fw-semibold"
                            style="background-color: #6AA276; border-color: #6AA276;">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
        <script th:src="@{/js/perfilesIngreso.js}"></script>
        <div th:replace="fragments/fragment :: scripts"></div>
    </body>
</html>
