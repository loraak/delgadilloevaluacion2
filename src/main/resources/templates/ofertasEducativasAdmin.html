<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/fragment :: head('Ofertas Educativas')"></head>

    <body> 
        <nav th:replace="fragments/fragment :: navbar"></nav>
        <nav th:replace="fragments/fragment :: breadcrumb('Panel de Ofertas Educativas', null, null)"></nav>
        <div class="container">
            <main>
                <h2 class="text-center my-4">Panel - Ofertas Educativas</h2>
                <div class="row row-cols-1 row-cols-md-3 g-4 mb-5" id="ofertas-container">      
                    <div class="col" th:each="oferta : ${ofertas}" th:id="|oferta-card-${oferta.id}|">
                        <div class="card h-100 shadow-sm border-1">
                            <img th:src="@{${oferta.imagen}}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <h6 class="fw-semibold text-secondary">Nombre de la oferta:</h6>
                                <h5 class="card-title fw-bold" th:text="${oferta.nombreOferta}">Nombre de la oferta</h5>
                                <div class="mb-2">
                                    <h7 class="fw-semibold text-secondary">Modalidad:</h7>
                                    <span class="text-dark" th:text="${oferta.modalidad}">Modalidad</span>
                                </div>
                                <div class="mb-2">
                                    <h7 class="fw-semibold text-secondary">División:</h7>
                                    <span class="text-dark" th:text="${oferta.division != null ? oferta.division.nombre : 'Sin División'}">División</span>
                                </div>
                                <div class="mb-2">
                                    <span class="fw-bold">Perfil de Ingreso: </span>
                                    <span class="text-dark" th:text="${oferta.perfilDeIngreso != null ? oferta.perfilDeIngreso.titulo : 'Sin perfil registrado'}"></span>
                                </div>
                                <div class="mt-auto pt-3">
                                    <button type="button" class="btn text-white w-100 fw-semibold"
                                        style="background-color: #6AA276; border-color: #6AA276;"
                                        th:onclick="|abrirModalOferta(${oferta.id})|">Editar</button>
                                </div>
                                <div class="mt-2">
                                    <button type="button" class="btn text-white w-100 fw-semibold" style="background-color: #C73E3E; border-color:#C73E3E;" th:onClick="|eliminarOferta(${oferta.id})|"> Eliminar </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <button type="button" onclick="abrirModalOferta()"
            class="btn text-white rounded-circle d-flex align-items-center justify-content-center shadow-lg"
            style="position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background-color: #6AA276; border-color: #6AA276; font-size: 30px; z-index: 500;" title="Agregar Oferta">
            +
        </button>

        <!-- Modal -->
        <div class="modal fade" id="ofertaModal" tabindex="-1" aria-labelledby="ofertaModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="ofertaModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="ofertaForm" class="needs-validation" novalidate onsubmit="guardarOferta(event)">
                            <input type="hidden" id="ofertaId" name="id">
                            <div class="mb-3">
                                <label for="nombreOferta" class="form-label fw-bold">Nombre de la oferta:</label>
                                <input type="text" class="form-control" id="nombreOferta" name="nombreOferta"
                                    placeholder="Ingrese el nombre de la oferta" required>
                                <div class="invalid-feedback">Por favor ingrese el nombre.</div>
                            </div>
                            <div class="mb-3">
                                <label for="modalidad" class="form-label fw-bold">Modalidad:</label>
                                <input type="text" class="form-control" id="modalidad" name="modalidad"
                                    placeholder="Ingrese la modalidad" required>
                                <div class="invalid-feedback">Por favor ingrese la modalidad.</div>
                            </div>
                            <div class="mb-3">
                                <label for="divisionId" class="form-label fw-bold">División:</label>
                                <select class="form-select" id="divisionId" name="divisionId">
                                    <option value="">Seleccione una división</option>
                                    <option th:each="division : ${divisiones}"
                                        th:value="${division.id}"
                                        th:text="${division.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="imagen" class="form-label fw-bold">URL de la imagen:</label>
                                <input type="text" class="form-control" id="imagen" name="imagen"
                                    placeholder="Ingrese la URL de la imagen">
                                <img id="imagenPreview" src="" alt="Preview"
                                    class="mt-2 d-none"
                                    style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
                            </div>
                            <div id="ofertaAlertaError" class="alert alert-danger d-none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" form="ofertaForm" class="btn text-white fw-semibold"
                            style="background-color: #6AA276; border-color: #6AA276;">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
        <script th:src="@{/js/ofertas.js}"></script>
        <div th:replace="fragments/fragment :: scripts"></div>
    </body>
</html>
